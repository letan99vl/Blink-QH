name: QHECU

options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO

targets:
  QHECU:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: QHECU
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.qhecu.app
        PRODUCT_NAME: QH ECU
        INFOPLIST_FILE: QHECU/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_BITCODE: NO

schemes:
  QHECU:
    build:
      targets:
        QHECU: all
    run:
      config: Debug
    archive:
      config: Release
